[package]
name = "audio-switcher-rust"
version = "0.1.2"
edition = "2024"
description = "Audio Switcher Rust tray tool"
authors = []
repository = "https://github.com/Wildfire2282/audio-switcher-rust"
license = "MIT"
rust-version = "1.85"
readme = "README.md"
keywords = ["audio", "tray", "windows", "switcher"]
categories = ["os::windows"]

[dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
]
}
tray-icon = "0.24.2"
muda = "0.19.3"
auto-launch = "0.6.0"
single-instance = "0.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
windows-core = "0.62"
thiserror = "2.0"
[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
embed-manifest = "1.4"
winres = "0.1.12"

[lib]
name = "audio_switcher_rust"
path = "src/lib.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
incremental = false
overflow-checks = true

[profile.dev]
# dev keeps unwind for backtraces and #[should_panic] — release uses abort for size
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows)'] }
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
correctness = { level = "deny", priority = 1 }
suspicious = { level = "warn", priority = 1 }
style = { level = "warn", priority = 1 }
complexity = { level = "warn", priority = 1 }
perf = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -1 }
# FFI casts handled per-module with // SAFETY; no global allows

